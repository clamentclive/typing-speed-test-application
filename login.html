<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Login - Typing Speed Test</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Typing Speed Test</h1>
            <p class="subtitle">
                Login to start your typing test
            </p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>
                </div>
                <div class="input-group">
                    <label for="password">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>
                </div>
                <p id="errorMessage"></p>
                <button type="submit">
                    Login
                </button>
            </form>
            <div class="demo-login">
                <p>Demo Login</p>
                <span>Username: admin</span>
                <span>Password: 12345</span>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
